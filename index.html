#splash .spn{font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:700;color:var(--tx,#1a1a1a);letter-spacing:.5px}
#splash.out{opacity:0;pointer-events:none}
.dsh{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:600;font-size:15px;gap:8px}
.dsh .dar{font-size:13px;color:var(--mut);white-space:nowrap}
.dfold{margin-bottom:8px!important}
.dfold.closed>.dbody{display:none}
.dbody{margin-top:10px}
details.ox{border-top:1px solid var(--bd);margin-top:8px}
details.ox summary{list-style:none;cursor:pointer;padding:10px 0;font-weight:600;font-size:13px;display:flex;justify-content:space-between}
details.ox summary::-webkit-details-marker{display:none}
details.ox summary:after{content:'Show ▾';font-weight:400;color:var(--mut)}
details.ox[open] summary:after{content:'Hide ▴'}
.clrall{font-size:13px;font-weight:700;color:#dc2626;text-decoration:none}
.cbx{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:4px}
.cchip{position:relative;display:inline-flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:14px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cchip.on{border-color:var(--lime2);background:var(--lime);color:#123;font-weight:700}
.cchip .cx{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:rgba(0,0,0,.08)}
.cchip .cx:hover{background:#dc2626;color:#fff}
.cmenu{position:fixed;z-index:200;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);overflow:hidden}
.cmenu div{padding:10px 18px;cursor:pointer;font-size:14px}
.cmenu div:hover{background:rgba(132,204,22,.15)}
.av{border-radius:50%;object-fit:cover;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;vertical-align:middle;background:#84cc16}
.uline{display:flex;gap:10px;align-items:center}
.fsort{display:flex;gap:18px;margin:4px 0 6px;font-size:14px}
.fsort span{cursor:pointer;color:var(--mut,#777);padding:4px 0}
.fsort span.on{color:var(--lime2);font-weight:700;border-bottom:2px solid var(--lime2)}
.fchips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fch{flex:0 0 auto;font-size:13px;padding:5px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;white-space:nowrap}
.fch.on{border-color:var(--lime2);color:var(--lime2);font-weight:700;background:rgba(132,204,22,.08)}
.fdrop{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fopt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);cursor:pointer;font-size:14px;background:var(--card);color:var(--tx)}
.fopt.on{border-color:var(--lime2);color:var(--lime2);font-weight:700;background:rgba(132,204,22,.1)}
.fopt .fn{margin-left:auto;font-size:11px;color:#999;font-weight:400}
.fsw{width:16px;height:16px;border-radius:50%;border:1px solid #bbb;flex:0 0 16px}
.fbtns{display:flex;gap:10px;margin-top:10px}
.fbtns button{flex:1}
.factive{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.factive span{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--lime);color:#123;cursor:pointer}
.fpan{display:flex;height:66vh;margin:0 -16px;border-top:1px solid var(--bd)}
.fnav{flex:0 0 96px;overflow:auto;background:rgba(0,0,0,.04);font-size:13px}
.fnav div{padding:12px 8px;cursor:pointer;border-left:3px solid transparent}
.fnav div.on{background:var(--card);border-left-color:var(--lime2);color:var(--lime2);font-weight:700}
.fbody{flex:1;overflow:auto;padding:4px 12px 12px}
.fbody h4{margin:14px 0 8px}
.szs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.szb{min-width:44px;padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:14px}
.szb.on{border-color:var(--lime2);background:var(--lime);color:#123;font-weight:700}
.pdt{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.pdt td{padding:4px 6px;border-bottom:1px solid var(--bd);vertical-align:top}
.pdt td:first-child{color:#888;width:90px}
.rvhd{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;margin:14px 0 6px}
.rvhd b{font-size:17px}
.rvpc{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--bd);margin:0 6px 8px 0;cursor:pointer;color:var(--tx)}
.rvpc.on{border-color:var(--lime2);background:var(--lime);color:#123}
.rvp{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.rvpt{flex:1;min-width:0}
.rvtx{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.rvsm{font-size:12px;margin-top:3px}
.rvpi{width:58px;height:58px;flex:0 0 58px;object-fit:cover;border-radius:8px;background:#ddd}
.rva{border-bottom:1px solid var(--bd);padding:10px 0;position:relative}
.rva .rvtx.full{-webkit-line-clamp:unset;display:block}
.rvth{display:flex;gap:6px;overflow-x:auto;margin-top:6px}
.rvth img{width:72px;height:72px;flex:0 0 72px;object-fit:cover;border-radius:8px;cursor:pointer;background:#ddd}
.rvv{background:#000;color:#fff;margin:-16px;padding:10px 12px 14px;border-radius:16px}
.rvvs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.rvvs::-webkit-scrollbar{display:none}
.rvvs img{flex:0 0 100%;width:100%;height:58vh;object-fit:contain;scroll-snap-align:center}
.rvvc{font-size:14px;margin-top:8px;min-height:60px}
.rvvc .rvtx{-webkit-line-clamp:3}
.rvmini img,.rvmini video{height:80px;width:80px;flex:0 0 80px;object-fit:cover;border-radius:8px;background:#000}
.pvid{display:block;width:100%;max-height:420px;border-radius:10px;background:#000}

/* ===== Clean clothing-brand theme (overrides) ===== */
:root{--bg:#ffffff;--card:#ffffff;--tx:#1a1a1a;--mut:#757575;--bd:#e8e6e1;--soft:#f6f5f2;--lime:#1a1a1a;--lime2:#1a1a1a;--onpri:#ffffff;--red:#c0392b;--grn:#2e7d32;--shadow:none;--ser:'Playfair Display',Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#181818;--tx:#f1f1f1;--mut:#a3a3a3;--bd:#2c2c2c;--soft:#1f1f1f;--lime:#f1f1f1;--lime2:#f1f1f1;--onpri:#111111}}
:root[data-theme="dark"]{--bg:#121212;--card:#181818;--tx:#f1f1f1;--mut:#a3a3a3;--bd:#2c2c2c;--soft:#1f1f1f;--lime:#f1f1f1;--lime2:#f1f1f1;--onpri:#111111}
body{font-family:'Jost',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;letter-spacing:.1px}
h1,h2,h3{font-family:var(--ser);font-weight:600;letter-spacing:.2px}
h2{font-size:24px}
button{background:var(--lime);color:var(--onpri);border-radius:4px;font-weight:500;letter-spacing:.3px}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--tx)}
button.sm{border-radius:4px}
a.btn{background:var(--lime);color:var(--onpri);border-radius:4px;font-weight:500}
input,select,textarea{border-radius:4px;border-color:var(--bd)}
header{background:var(--bg)!important;border-bottom:1px solid var(--bd)!important;box-shadow:none;padding:10px 14px}
.logo .wdt{font-family:var(--ser);font-style:normal;font-weight:700;letter-spacing:.5px;font-size:27px}
.sbox input{border:1px solid var(--bd)!important;background:var(--soft)!important;color:var(--tx)!important;border-radius:4px;padding-left:38px}
.sbox .sic{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mut);pointer-events:none}
.ibtn{background:transparent!important;color:var(--tx)!important;padding:6px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center}
.ibtn svg{width:24px;height:24px}
#cartb{flex-direction:column;gap:0;line-height:1}#cartb .ilab{font-size:9.5px;font-weight:600;margin-top:1px;letter-spacing:.2px}
.badge{background:var(--tx);color:var(--bg);top:-2px;right:-4px}
nav{background:var(--bg);border-bottom:1px solid var(--bd);gap:2px;padding:0 10px;justify-content:flex-start}
nav button{background:transparent!important;border:0!important;border-bottom:2px solid transparent!important;border-radius:0;color:var(--mut)!important;padding:11px 10px;font-weight:500;text-transform:uppercase;font-size:12.5px;letter-spacing:1px}
nav button.on{color:var(--tx)!important;border-bottom-color:var(--tx)!important}
nav button.thm{margin-left:auto;display:inline-flex;align-items:center}
nav button svg{width:18px;height:18px}
main{padding:14px}
.card{border-radius:6px;box-shadow:none;border:1px solid var(--bd)}
.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px 12px}
.grid>.card.pc{border:0;background:transparent;border-radius:0;overflow:visible}
.pc .pcm{position:relative;cursor:pointer;background:var(--soft);border-radius:4px;overflow:hidden}.pblur{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(10px);transform:scale(1.15)}.pcm .pimg{position:relative}.pimg.pld{opacity:0}.pcm .pimg{transition:opacity .35s,transform .4s}
.pc .pimg{aspect-ratio:3/4;object-fit:cover;width:100%;display:block;background:var(--soft);transition:transform .4s}
.pc:hover .pimg{transform:scale(1.03)}
.pc .pad{padding:8px 2px 0;cursor:pointer}
.pc .pcn{font-size:14px;line-height:1.35;height:2.7em;overflow:hidden;color:var(--tx)}
.pc .pcp{margin-top:3px}
.price{color:var(--tx);font-weight:600}
.old{color:var(--mut)}
.tag,.pct{position:absolute;top:8px;left:8px;background:var(--tx);color:var(--bg);border-radius:2px;padding:2px 7px;font-size:11.5px;font-weight:600;letter-spacing:.5px}
.pct.so{background:#777;color:#fff}
.heart,.pch{position:absolute;top:6px;right:6px;width:32px;height:32px;padding:0;border-radius:50%;background:rgba(255,255,255,.9)!important;color:#1a1a1a!important;display:flex;align-items:center;justify-content:center;border:0}
.pch svg{width:17px;height:17px}
.pch.on{color:#c0392b!important}
.chip .swi{border-radius:4px}
button.chip{border-radius:6px;border:1px solid var(--bd)}
button.chip.on{border-color:var(--tx);box-shadow:0 0 0 1px var(--tx)}
.szb{border-radius:4px}
.szb.on,.cchip.on,.rvpc.on,.factive span{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.cchip{border-radius:4px}
.fch{border-radius:4px}
.fch.on,.fopt.on{color:var(--tx);border-color:var(--tx);background:var(--soft)}
.fsort span.on{color:var(--tx);border-bottom-color:var(--tx)}
.fnav div.on{color:var(--tx);border-left-color:var(--tx)}
.stars{color:#c9a227}
.offbar{background:var(--tx);color:var(--bg);text-align:center;padding:9px 12px;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin:-14px -14px 14px}
.sechd{font-family:var(--ser);font-size:22px;text-align:center;margin:8px 0 14px}
.ldm{display:flex;justify-content:center;padding:18px 0 28px}
.ldm .spin{width:30px;height:30px;border:3px solid var(--bd);border-top-color:var(--lime);border-radius:50%;animation:ldspin .8s linear infinite}
@keyframes ldspin{to{transform:rotate(360deg)}}
.sst{display:flex;gap:14px;margin-top:4px}.sst>div{flex:1}.sst span{display:block;font-size:12px}
.dqw{margin:8px 0 2px}.dq{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:999px;font-size:14px;background:var(--card);color:var(--tx)}
.unpb{background:#f59e0b!important;color:#fff!important;border-color:#f59e0b!important}
.unptag{font-size:12px;font-weight:700;color:#b45309;background:#fef3c7;border-radius:999px;padding:5px 10px;align-self:center}
.otabs{margin:4px 0 10px}.otabs button{font-size:12.5px;padding:8px 2px}
.trust{margin:8px 0;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600}.trust.tbad{background:#fee2e2;color:#991b1b}.trust.tok{background:#dcfce7;color:#166534}.trust.tnew{background:var(--soft,#f3f4f6);color:var(--tx)}
.wab2{display:inline-block;background:#25d366;color:#fff!important;border-radius:999px;padding:7px 12px;text-decoration:none;font-weight:700;font-size:13px}
.szlk{font-size:13px;font-weight:600;color:var(--lime2);text-decoration:underline}
.seabar{display:flex;align-items:center;gap:8px;margin:8px 0 4px}
.seasw{display:flex;flex:1;gap:3px;padding:3px;border:1px solid var(--bd);border-radius:999px}
.seasw button{flex:1;margin:0;min-height:0;padding:8px 4px;border:0;border-radius:999px;background:transparent;color:var(--tx);font-size:13px;font-weight:600;box-shadow:none;white-space:nowrap}
.seasw button.on{background:var(--lime);color:var(--onpri)}
.seaclr{margin:0;min-height:0;padding:7px 10px;border-radius:999px;background:transparent;border:1px solid #d33;color:#d33;font-size:12px;font-weight:600;box-shadow:none;white-space:nowrap}
.seanote{font-size:12px;text-align:center;margin:0 0 12px}
.box{border-radius:8px}
.sbar i{background:var(--tx)}
.av{background:#8a8a8a}
/* product page */
.pv{display:grid;gap:18px}
@media(min-width:760px){.pv{grid-template-columns:1.1fr 1fr;align-items:start}}
.pv .gal .gm{border-radius:4px;background:var(--soft)}
.pv .gal .gb{height:auto;aspect-ratio:3/4;max-height:72vh;object-fit:cover}
.pvn{font-size:24px;margin:0 0 6px;line-height:1.25}
.pvp{font-size:20px;margin-bottom:6px}
.pvp .price{font-size:21px}
.pvp .tag{position:static;margin-left:8px;vertical-align:middle}.pvcpn{border:1px dashed var(--grn,#1a8f3c);border-radius:10px;padding:10px 12px;margin:6px 0 10px;font-size:14px}
.pvr{font-size:13px;color:var(--mut);cursor:pointer;margin-bottom:6px}
.pvb{display:flex;gap:8px;margin:14px 0 8px}
.pvb button{flex:1;padding:13px 10px;font-size:14px;text-transform:uppercase;letter-spacing:1px}
.pvb .lk{flex:0 0 48px;padding:0;display:flex;align-items:center;justify-content:center}
.pvb .lk svg{width:20px;height:20px}
.pvs{font-size:13px;color:var(--mut);margin:4px 0}
.pvl{font-size:13px;text-decoration:underline;cursor:pointer;color:var(--tx);background:none;border:0;padding:0;font-weight:500}
.acc{border-top:1px solid var(--bd)}
.acc:last-of-type{border-bottom:1px solid var(--bd)}
.acc summary{list-style:none;cursor:pointer;padding:14px 2px;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between}
.acc summary::-webkit-details-marker{display:none}
.acc summary:after{content:'+';font-size:18px;font-weight:400}
.acc[open] summary:after{content:'–'}
.acc .accb{padding:0 2px 14px;font-size:14px;line-height:1.6}
.own{display:flex;gap:8px;margin-top:10px}
/* pages + footer */
footer.ft{border-top:1px solid var(--bd);margin-top:30px;padding:24px 14px 90px;text-align:center;color:var(--mut);font-size:13px}
footer.ft .fl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin-bottom:12px}
footer.ft a{color:var(--tx);text-decoration:none;cursor:pointer}
footer.ft .fb{font-family:var(--ser);font-size:20px;color:var(--tx);margin-bottom:10px}
.pgc{max-width:760px;margin:0 auto;line-height:1.7}
.pgc h3{margin:18px 0 6px;font-size:19px}
.pgc table{margin:10px 0}.pgc td,.pgc th{font-size:14px;padding:8px}
.pgc th{background:var(--soft)}

/* ===== Colour themes: green (default), orange, dark ===== */
:root{--lime:#7ac70c;--lime2:#4f9a00;--onpri:#10200a;--bg:#ffffff;--card:#ffffff;--tx:#1b2412;--mut:#6b7560;--bd:#e3ead9;--soft:#f3f8ea;--red:#d64040}

nav button.on{color:var(--lime2)!important;border-bottom-color:var(--lime)!important}
button{background:var(--lime);color:var(--onpri)}

:root[data-theme="dark"] header{background:#0d1109!important;border-bottom:1px solid var(--bd)!important}

:root[data-theme="dark"] .sbox input{background:#161c11!important;color:var(--tx)!important}
:root[data-theme="dark"] .pch{background:rgba(20,26,15,.85)!important;color:#eef3e6!important}
:root[data-theme="dark"] .pc .pcm{background:#1e2617}
